name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Format, Lint, Typecheck, Audit, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_dev_secret
          POSTGRES_DB: pos_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_server"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pos:pos_dev_secret@localhost:5432/pos_server
      JWT_SECRET: ci_user_jwt_secret_minimum_32_characters_long_01
      DEVICE_JWT_SECRET: ci_device_jwt_secret_minimum_32_characters_long_02

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check dependency vulnerabilities
        run: pnpm audit

      - name: Run database migrations
        run: pnpm --filter @pos/server migrate

      - name: Run test suite
        run: pnpm test

      - name: Build production bundles
        run: |
          pnpm --filter @pos/server build
          pnpm --filter @pos/web build
          pnpm --filter @pos/desktop build
